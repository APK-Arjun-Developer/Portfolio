sonar.projectKey=APK-Arjun-Developer_Portfolio
sonar.organization=apk-arjun-developer

sonar.projectName=Portfolio

# Source files (both UI themes — whichever VITE_UI_THEME selects ships to production)
sonar.sources=src
sonar.exclusions=src/vite-env.d.ts

# No unit tests yet. When Vitest is added, generate lcov and enable:
# sonar.tests=src
# sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx
# sonar.javascript.lcov.reportPaths=coverage/lcov.info

# TypeScript config (root tsconfig.json only holds project references)
sonar.typescript.tsconfigPaths=tsconfig.app.json,tsconfig.node.json

# Encoding
sonar.sourceEncoding=UTF-8

# Wait for the Quality Gate result and fail the workflow when it fails.
# Without this, the SonarCloud action always exits 0 and PRs are never blocked.
sonar.qualitygate.wait=true
