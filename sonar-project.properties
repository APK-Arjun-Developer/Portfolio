sonar.projectKey=APK-Arjun-Developer_Portfolio
sonar.organization=apk-arjun-developer

sonar.projectName=Portfolio

# Source files (both UI themes — whichever VITE_UI_THEME selects ships to production)
sonar.sources=src
sonar.exclusions=src/__tests__/**,src/vite-env.d.ts

# Test files
sonar.tests=src/__tests__
sonar.test.inclusions=src/__tests__/**/*.test.ts,src/__tests__/**/*.test.tsx

# Coverage report (generated by vitest --coverage)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Entry bootstrap only mounts <App /> — nothing to unit test.
sonar.coverage.exclusions=src/main.tsx

# Portfolio content (project write-ups) is structured data, not logic: every project
# object shares the same shape, which copy-paste detection reports as duplication.
sonar.cpd.exclusions=src/data/**

# TypeScript config (root tsconfig.json only holds project references)
sonar.typescript.tsconfigPaths=tsconfig.app.json,tsconfig.node.json

# Encoding
sonar.sourceEncoding=UTF-8

# Wait for the Quality Gate result and fail the workflow when it fails.
# Without this, the SonarCloud action always exits 0 and PRs are never blocked.
sonar.qualitygate.wait=true
